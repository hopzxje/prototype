<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StayHub - Khách thăm của tôi</title>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body class="bg-slate-50 min-h-screen flex flex-col font-sans">
  <div id="demo-role-bar"></div>

  <div class="flex-1 flex overflow-hidden">
    <aside id="app-sidebar" class="w-64 bg-white border-slate-200 flex flex-col shrink-0 min-h-[calc(100vh-41px)]"></aside>
    <main class="flex-1 flex flex-col min-w-0 overflow-y-auto">
      <header id="app-topbar"></header>
      <div class="p-6 max-w-6xl w-full mx-auto space-y-6">
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
          <div>
            <p class="text-xs font-semibold text-teal-700 uppercase tracking-wider">Cư dân / Khách thăm</p>
            <h2 class="text-2xl font-extrabold text-slate-900 mt-1">Khách thăm của tôi</h2>
            <p class="text-sm text-slate-500 mt-1">Đăng ký và theo dõi khách đến căn hộ <strong data-resident-room>P201</strong>.</p>
          </div>
          <button type="button" onclick="openModal('residentVisitorModal')" class="flex items-center justify-center gap-2 px-4 py-2 bg-[#166534] hover:bg-[#14532D] text-white rounded-lg text-sm font-semibold">
            <i data-lucide="user-plus" class="w-4 h-4"></i>
            Đăng ký khách mới
          </button>
        </div>

        <section class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
          <div class="p-4 border-b border-slate-200 flex items-center justify-between gap-3">
            <div class="flex items-center gap-2"><i data-lucide="users" class="w-5 h-5 text-teal-600"></i><h3 class="font-bold text-slate-900">Lịch khách thăm của tôi</h3></div>
            <span class="text-xs text-slate-500" data-visitor-count>0 lượt đăng ký</span>
          </div>
          <div class="overflow-x-auto">
            <table class="w-full text-left text-xs text-slate-600">
              <thead class="bg-slate-50 text-slate-700 uppercase font-semibold text-[11px] tracking-wider">
                <tr><th class="p-3.5">Khách thăm</th><th class="p-3.5">CCCD</th><th class="p-3.5">Thời gian dự kiến</th><th class="p-3.5">Mục đích</th><th class="p-3.5">Trạng thái</th></tr>
              </thead>
              <tbody id="resident-visitors-tbody" class="divide-y divide-slate-100"></tbody>
            </table>
          </div>
        </section>
      </div>
    </main>
  </div>

  <div id="residentVisitorModal" class="modal-backdrop">
    <div class="modal-content p-6">
      <div class="flex items-center justify-between border-b border-slate-200 pb-3">
        <div><h3 class="text-lg font-bold text-slate-900">Đăng ký khách đến thăm</h3><p class="text-xs text-slate-500 mt-1">Thông tin sẽ được gửi tới ban quản lý để tiếp nhận.</p></div>
        <button type="button" onclick="closeModal('residentVisitorModal')" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <form id="residentVisitorForm" class="mt-4 space-y-4 text-xs">
        <div><label class="block font-semibold text-slate-700 mb-1">Họ tên khách <span class="text-red-500">*</span></label><input id="resident-visitor-name" required class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5" placeholder="Nguyễn Văn X"></div>
        <div><label class="block font-semibold text-slate-700 mb-1">Số CCCD <span class="text-red-500">*</span></label><input id="resident-visitor-cccd" required class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5" placeholder="00120..."></div>
        <div><label class="block font-semibold text-slate-700 mb-1">Thời gian dự kiến</label><input id="resident-visitor-time" value="20:00 hôm nay" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5"></div>
        <div><label class="block font-semibold text-slate-700 mb-1">Mục đích đến thăm</label><input id="resident-visitor-note" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5" placeholder="Bạn bè ghé thăm..."></div>
        <div class="flex justify-end gap-3 pt-3 border-t border-slate-200"><button type="button" onclick="closeModal('residentVisitorModal')" class="px-4 py-2 bg-slate-100 text-slate-700 rounded-lg font-medium">Hủy</button><button type="submit" class="px-4 py-2 bg-[#166534] text-white rounded-lg font-semibold">Gửi đăng ký</button></div>
      </form>
    </div>
  </div>

  <script src="../../js/data.js"></script>
  <script src="../../js/app.js"></script>
  <script>
    function residentVisitorBadge(visitor) {
      const status = visitor.status;
      if (status === 'FORWARDED_MANAGER') {
        return `<span class="badge bg-purple-100 text-purple-800 border border-purple-200 font-bold">Chờ Quản lý duyệt</span>`;
      }
      if (status === 'REJECTED') {
        return `<span class="badge badge-danger cursor-pointer" onclick="alert('Lý do từ chối:\\n${visitor.rejectReason || 'Không đáp ứng quy định ra vào tòa nhà'}')">✕ Bị từ chối (Xem lý do)</span>`;
      }
      const labels = {
        PENDING: ['Chờ Staff duyệt', 'badge-warning'],
        APPROVED: ['✓ Đã duyệt (Chờ đón)', 'badge-info'],
        IN_BUILDING: ['Đang trong tòa nhà', 'badge-success'],
        DEPARTED: ['Đã rời đi (Hoàn tất)', 'badge-neutral']
      };
      const item = labels[status] || ['Chờ duyệt', 'badge-warning'];
      return `<span class="badge ${item[1]}">${item[0]}</span>`;
    }

    function renderResidentVisitors() {
      const user = DataStore.getUser();
      const visitors = DataStore.getVisitors().filter(visitor => visitor.hostRoom === user.room && visitor.hostTenant === user.fullName);
      const body = document.getElementById('resident-visitors-tbody');
      const count = document.querySelector('[data-visitor-count]');
      if (count) count.textContent = `${visitors.length} lượt đăng ký`;
      body.innerHTML = visitors.length ? visitors.map(visitor => `
        <tr class="hover:bg-slate-50">
          <td class="p-3.5 font-bold text-slate-900">${visitor.guestName}</td>
          <td class="p-3.5 font-mono text-slate-500">${visitor.cccd}</td>
          <td class="p-3.5">${visitor.timeExpected}</td>
          <td class="p-3.5 text-slate-500">${visitor.note || '—'}</td>
          <td class="p-3.5">${residentVisitorBadge(visitor)}</td>
        </tr>
      `).join('') : '<tr><td colspan="5" class="p-6 text-center text-slate-500">Chưa có khách thăm được đăng ký.</td></tr>';
    }

    document.addEventListener('DOMContentLoaded', () => {
      const user = DataStore.getUser();
      document.querySelector('[data-resident-room]').textContent = user.room || '—';
      renderSidebar('resident-visitors.html');
      renderTopbar('Khách thăm của tôi', 'Cư dân / Đăng ký khách thăm');
      renderResidentVisitors();
      document.getElementById('residentVisitorForm').addEventListener('submit', (event) => {
        event.preventDefault();
        const visitors = DataStore.getVisitors();
        visitors.unshift({
          id: `vis-${Date.now()}`,
          guestName: document.getElementById('resident-visitor-name').value.trim(),
          cccd: document.getElementById('resident-visitor-cccd').value.trim(),
          hostRoom: user.room,
          hostTenant: user.fullName,
          timeExpected: document.getElementById('resident-visitor-time').value.trim(),
          note: document.getElementById('resident-visitor-note').value.trim(),
          status: 'PENDING'
        });
        DataStore.saveVisitors(visitors);
        event.currentTarget.reset();
        closeModal('residentVisitorModal');
        showToast('Đã gửi đăng ký khách thăm đến ban quản lý');
        renderResidentVisitors();
      });
      lucide.createIcons();
    });
  </script>
</body>
</html>
