<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StayHub - Tài khoản của tôi</title>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body class="bg-slate-50 min-h-screen flex flex-col font-sans">
  <div id="demo-role-bar"></div>

  <div class="flex-1 flex overflow-hidden">
    <aside id="app-sidebar" class="w-64 bg-white border-slate-200 flex flex-col shrink-0 min-h-[calc(100vh-41px)]"></aside>

    <main class="flex-1 flex flex-col min-w-0 overflow-y-auto">
      <header id="app-topbar"></header>

      <div class="p-6 max-w-4xl w-full mx-auto space-y-6">
        <section class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
          <div class="flex items-center gap-3 mb-6">
            <div class="w-10 h-10 rounded-lg bg-teal-50 text-teal-700 flex items-center justify-center">
              <i data-lucide="user-cog" class="w-5 h-5"></i>
            </div>
            <div>
              <h2 class="text-lg font-bold text-slate-900">Thông tin tài khoản</h2>
              <p class="text-xs text-slate-500 mt-1">Cập nhật thông tin liên hệ và tên hiển thị của bạn.</p>
            </div>
          </div>

          <form id="account-form" class="space-y-4">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <label class="space-y-1">
                <span class="text-xs font-semibold text-slate-600">Họ và tên</span>
                <input id="account-full-name" name="fullName" required class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 text-sm text-slate-900 focus:bg-white focus:outline-teal-600">
              </label>
              <label class="space-y-1">
                <span class="text-xs font-semibold text-slate-600">Số điện thoại</span>
                <input id="account-phone" name="phone" required class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 text-sm text-slate-900 focus:bg-white focus:outline-teal-600">
              </label>
            </div>
            <label class="space-y-1 block">
              <span class="text-xs font-semibold text-slate-600">Email đăng nhập</span>
              <input id="account-email" name="email" type="email" required class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 text-sm text-slate-900 focus:bg-white focus:outline-teal-600">
            </label>
            <div class="flex justify-end pt-2">
              <button type="submit" class="px-4 py-2 bg-[#166534] hover:bg-[#14532D] text-white rounded-lg text-sm font-semibold transition-colors">Lưu thông tin</button>
            </div>
          </form>
        </section>

        <section class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
          <div class="flex items-center gap-3 mb-6">
            <div class="w-10 h-10 rounded-lg bg-amber-50 text-amber-600 flex items-center justify-center">
              <i data-lucide="lock-keyhole" class="w-5 h-5"></i>
            </div>
            <div>
              <h2 class="text-lg font-bold text-slate-900">Đổi mật khẩu</h2>
              <p class="text-xs text-slate-500 mt-1">Sử dụng mật khẩu mới có ít nhất 6 ký tự.</p>
            </div>
          </div>

          <form id="password-form" class="space-y-4">
            <label class="space-y-1 block">
              <span class="text-xs font-semibold text-slate-600">Mật khẩu hiện tại</span>
              <input name="currentPassword" type="password" required class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 text-sm text-slate-900 focus:bg-white focus:outline-teal-600">
            </label>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <label class="space-y-1">
                <span class="text-xs font-semibold text-slate-600">Mật khẩu mới</span>
                <input id="new-password" name="newPassword" type="password" minlength="6" required class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 text-sm text-slate-900 focus:bg-white focus:outline-teal-600">
              </label>
              <label class="space-y-1">
                <span class="text-xs font-semibold text-slate-600">Nhập lại mật khẩu mới</span>
                <input id="confirm-password" name="confirmPassword" type="password" minlength="6" required class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 text-sm text-slate-900 focus:bg-white focus:outline-teal-600">
              </label>
            </div>
            <div class="flex justify-end pt-2">
              <button type="submit" class="px-4 py-2 bg-slate-100 hover:bg-teal-50 hover:text-teal-700 text-slate-700 rounded-lg text-sm font-semibold transition-colors">Cập nhật mật khẩu</button>
            </div>
          </form>
        </section>
      </div>
    </main>
  </div>

  <script src="../../js/data.js"></script>
  <script src="../../js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const user = DataStore.getUser();
      renderSidebar('account.html');
      renderTopbar('Tài khoản của tôi', 'Cá nhân / Quản lý tài khoản');
      document.getElementById('account-full-name').value = user.fullName || '';
      document.getElementById('account-phone').value = user.phone || '0904445566';
      document.getElementById('account-email').value = user.email || '';

      document.getElementById('account-form').addEventListener('submit', (event) => {
        event.preventDefault();
        const formData = new FormData(event.currentTarget);
        DataStore.updateUser({
          fullName: formData.get('fullName').trim(),
          phone: formData.get('phone').trim(),
          email: formData.get('email').trim()
        });
        showToast('Đã cập nhật thông tin tài khoản');
        setTimeout(() => window.location.reload(), 500);
      });

      document.getElementById('password-form').addEventListener('submit', (event) => {
        event.preventDefault();
        const formData = new FormData(event.currentTarget);
        const newPassword = formData.get('newPassword');
        const confirmPassword = formData.get('confirmPassword');
        if (newPassword !== confirmPassword) {
          showToast('Mật khẩu nhập lại chưa khớp', 'error');
          return;
        }
        showToast('Đã cập nhật mật khẩu thành công');
        event.currentTarget.reset();
      });
    });
  </script>
</body>
</html>
