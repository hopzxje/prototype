<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StayHub - Cư dân & Lưu trú</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="../../css/style.css">
  <script src="../../js/data.js"></script>
  <script src="../../js/app.js"></script>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col font-sans">

  <div id="demo-role-bar"></div>

  <div class="flex-1 flex overflow-hidden">
    <aside id="app-sidebar" class="w-64 bg-white border-r border-slate-200 flex flex-col shrink-0 min-h-[calc(100vh-41px)]"></aside>

    <main class="flex-1 flex flex-col min-w-0 overflow-y-auto">
      <header id="app-topbar"></header>
      <script>initStayHubShell('residents.html', 'Danh sách Cư dân & Lưu trú', 'Cư dân / Danh sách');</script>

      <div class="p-6 max-w-7xl w-full mx-auto space-y-6">

        <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
          <div>
            <h2 class="text-xl font-bold text-slate-900">Danh sách Cư dân & Đăng ký Tạm trú</h2>
            <p class="text-xs text-slate-500 mt-0.5">Quản lý hồ sơ định danh, thông tin liên lạc và tình trạng khai báo công an phường</p>
          </div>
          <div id="add-resident-btn-container">
            <!-- Được render bởi checkResidentRoleAccess() -->
          </div>
        </div>

        <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
          <div class="p-4 border-b border-slate-200 flex items-center justify-between">
            <div class="flex items-center gap-2">
              <i data-lucide="users" class="w-5 h-5 text-teal-600"></i>
              <h3 class="font-bold text-slate-900 text-sm">Hồ Sơ Cư Dân Đang Lưu Trú</h3>
            </div>
            <input type="text" id="res-search" oninput="renderResidents()" placeholder="Tìm họ tên, SĐT, CCCD..." class="text-xs bg-slate-50 border border-slate-200 rounded-lg px-3 py-1.5 focus:outline-none w-56">
          </div>

          <div class="overflow-x-auto">
            <table class="w-full text-left text-xs text-slate-600">
              <thead class="bg-slate-50 text-slate-700 uppercase font-semibold text-[11px] tracking-wider border-b border-slate-200">
                <tr>
                  <th class="p-3.5">Họ và Tên</th>
                  <th class="p-3.5">Phòng / Cơ Sở</th>
                  <th class="p-3.5">Số Điện Thoại</th>
                  <th class="p-3.5">Số CCCD</th>
                  <th class="p-3.5">Ngày Bắt Đầu</th>
                  <th class="p-3.5">Khai Báo Tạm Trú</th>
                  <th class="p-3.5 text-right">Thao Tác</th>
                </tr>
              </thead>
              <tbody id="residents-tbody" class="divide-y divide-slate-100 font-medium">
                <!-- Rendered by JS -->
              </tbody>
            </table>
          </div>
        </div>

      </div>
    </main>
  </div>

  <!-- Modal: Thêm cư dân -->
  <div id="addResidentModal" class="modal-backdrop">
    <div class="modal-content p-6">
      <div class="flex items-center justify-between border-b border-slate-200 pb-3">
        <h3 class="text-lg font-bold text-slate-900">Thêm Hồ Sơ Cư Dân</h3>
        <button onclick="closeModal('addResidentModal')" class="text-slate-400 hover:text-slate-600">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <form onsubmit="handleAddResident(event)" class="mt-4 space-y-4 text-xs">
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block font-semibold text-slate-700 mb-1">Họ và tên <span class="text-red-500">*</span></label>
            <input type="text" id="res-name" placeholder="Nguyễn Văn B" required class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5">
          </div>
          <div>
            <label class="block font-semibold text-slate-700 mb-1">Phòng ở</label>
            <input type="text" id="res-room" value="P103" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 font-bold">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block font-semibold text-slate-700 mb-1">Số điện thoại <span class="text-red-500">*</span></label>
            <input type="text" id="res-phone" placeholder="0911..." required class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5">
          </div>
          <div>
            <label class="block font-semibold text-slate-700 mb-1">Số CCCD <span class="text-red-500">*</span></label>
            <input type="text" id="res-cccd" placeholder="00120..." required class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5">
          </div>
        </div>

        <div>
          <label class="block font-semibold text-slate-700 mb-1">Tình trạng đăng ký tạm trú</label>
          <select id="res-reg" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5">
            <option value="REGISTERED">Đã khai báo công an phường</option>
            <option value="PENDING">Chờ nộp hồ sơ</option>
          </select>
        </div>

        <div class="mt-6 flex items-center justify-end gap-3 pt-3 border-t border-slate-200">
          <button type="button" onclick="closeModal('addResidentModal')" class="px-4 py-2 border border-slate-200 rounded-lg text-slate-600 hover:bg-slate-50 font-medium">Hủy</button>
          <button type="submit" class="px-4 py-2 bg-[#0F766E] text-white rounded-lg font-semibold hover:bg-[#115E59]">Lưu Cư Dân</button>
        </div>
      </form>
    </div>
  </div>
  <script data-stayhub-page="residents.html">
    function getResidentsList() {
      return DataStore.getResidents();
    }

    function renderResidents() {
      const q = document.getElementById('res-search').value.toLowerCase();
      const tbody = document.getElementById('residents-tbody');
      const currentBldId = DataStore.getCurrentBuilding();
      const currentBld = DataStore.getBuildings().find(b => b.id === currentBldId);
      const bldNamePart = currentBld ? currentBld.name.split(' - ')[0] : 'StayHub Central';
      const residentsList = getResidentsList();

      const filtered = residentsList.filter(r => {
        const matchBuilding = currentBldId === 'ALL' || r.building.includes(bldNamePart) || r.building === (currentBld ? currentBld.name : '');
        const matchQuery = r.name.toLowerCase().includes(q) || r.phone.includes(q) || r.room.toLowerCase().includes(q) || r.cccd.includes(q);
        return matchBuilding && matchQuery;
      });

      tbody.innerHTML = filtered.map(r => `
        <tr class="hover:bg-slate-50">
          <td class="p-3.5">
            <div class="flex items-center gap-2.5">
              <div class="w-7 h-7 rounded-full bg-teal-100 text-teal-800 font-bold flex items-center justify-center text-xs">
                ${r.name.charAt(0)}
              </div>
              <span class="font-bold text-slate-900">${r.name}</span>
            </div>
          </td>
          <td class="p-3.5">
            <span class="font-bold text-teal-700">${r.room}</span>
            <span class="block text-[11px] text-slate-400">${r.building}</span>
          </td>
          <td class="p-3.5 font-mono">${r.phone}</td>
          <td class="p-3.5 font-mono text-slate-600">${r.cccd}</td>
          <td class="p-3.5">${r.startDate}</td>
          <td class="p-3.5">
            ${r.registered 
              ? '<span class="badge badge-success">✓ Đã khai báo</span>' 
              : '<span class="badge badge-warning">⏳ Chưa khai báo</span>'}
          </td>
          <td class="p-3.5 text-right">
            <button onclick="showToast('Xem hồ sơ chi tiết của cư dân ${r.name}');" class="text-teal-700 font-semibold hover:underline">Chi tiết &rarr;</button>
          </td>
        </tr>
      `).join('');

      lucide.createIcons();
    }

    // Kiểm tra phân quyền: Ẩn nút Thêm Cư Dân Mới đối với Manager, Admin và Resident (Chỉ Staff được thêm)
    function checkResidentRoleAccess() {
      const role = DataStore.getRole();
      const container = document.getElementById('add-resident-btn-container');
      if (!container) return;

      if (role === 'STAFF') {
        container.innerHTML = `
          <button onclick="openAddResidentModal()" class="flex items-center gap-2 px-4 py-2 bg-[#0F766E] hover:bg-[#115E59] text-white rounded-lg text-sm font-semibold shadow-sm transition-colors cursor-pointer">
            <i data-lucide="user-plus" class="w-4 h-4"></i>
            <span>Thêm Cư Dân Mới</span>
          </button>
        `;
        lucide.createIcons();
      } else {
        container.innerHTML = '';
      }
    }

    function openAddResidentModal() {
      const role = DataStore.getRole();
      if (role === 'MANAGER' || role === 'ADMIN' || role === 'RESIDENT') {
        showToast('Chỉ Nhân viên (Staff) mới có quyền thêm cư dân mới.', 'warning');
        return;
      }
      openModal('addResidentModal');
    }

    function handleAddResident(e) {
      e.preventDefault();
      const role = DataStore.getRole();
      if (role === 'MANAGER' || role === 'ADMIN' || role === 'RESIDENT') {
        showToast('Chỉ Nhân viên (Staff) mới có quyền thêm cư dân mới.', 'error');
        return;
      }

      const name = document.getElementById('res-name').value.trim();
      const room = document.getElementById('res-room').value.trim();
      const phone = document.getElementById('res-phone').value.trim();
      const cccd = document.getElementById('res-cccd').value.trim();
      const registered = document.getElementById('res-reg').value === 'REGISTERED';
      const currentBldId = DataStore.getCurrentBuilding();
      const currentBld = DataStore.getBuildings().find(b => b.id === currentBldId);

      const list = getResidentsList();
      list.unshift({
        name, room, building: currentBld ? currentBld.name : 'StayHub Central', phone, cccd, startDate: '02/10/2026', registered
      });
      DataStore.saveResidents(list);

      closeModal('addResidentModal');
      showToast(`Đã thêm cư dân ${name} vào phòng ${room}!`);
      renderResidents();
    }

    registerPage('residents.html', () => {
      renderSidebar('residents.html');
      renderTopbar('Danh sách Cư dân & Lưu trú', 'Cư dân / Danh sách');
      checkResidentRoleAccess();
      renderResidents();
      window.onFilterBuilding = function() {
        renderResidents();
      };
    });
  </script>
</body>
</html>
