<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StayHub - Quản lý Hợp đồng thuê</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-50 min-h-screen flex flex-col font-sans">

  <div id="demo-role-bar"></div>

  <div class="flex-1 flex overflow-hidden">
    <aside id="app-sidebar" class="w-64 bg-white border-r border-slate-200 flex flex-col shrink-0 min-h-[calc(100vh-41px)]"></aside>

    <main class="flex-1 flex flex-col min-w-0 overflow-y-auto">
      <header id="app-topbar"></header>

      <div class="p-6 max-w-7xl w-full mx-auto space-y-6">

        <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
          <div>
            <h2 class="text-xl font-bold text-slate-900">Quản lý Hợp đồng Thuê căn hộ</h2>
            <p class="text-xs text-slate-500 mt-0.5">Theo dõi thời hạn, tiền cọc, thông tin pháp lý cư dân và tự động cảnh báo hết hạn</p>
          </div>
          <button onclick="openModal('createContractModal')" class="flex items-center gap-2 px-4 py-2 bg-[#0F766E] hover:bg-[#115E59] text-white rounded-lg text-sm font-semibold shadow-sm transition-colors">
            <i data-lucide="plus-circle" class="w-4 h-4"></i>
            <span>Tạo Hợp Đồng Mới</span>
          </button>
        </div>

        <!-- Contracts Table -->
        <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
          <div class="p-4 border-b border-slate-200 flex items-center justify-between">
            <div class="flex items-center gap-2">
              <i data-lucide="file-text" class="w-5 h-5 text-teal-600"></i>
              <h3 class="font-bold text-slate-900 text-sm">Danh Sách Hợp Đồng</h3>
            </div>
            <input type="text" id="contract-search" oninput="renderContracts()" placeholder="Tìm số phòng, tên khách..." class="text-xs bg-slate-50 border border-slate-200 rounded-lg px-3 py-1.5 focus:outline-none w-52">
          </div>

          <div class="overflow-x-auto">
            <table class="w-full text-left text-xs text-slate-600">
              <thead class="bg-slate-50 text-slate-700 uppercase font-semibold text-[11px] tracking-wider">
                <tr>
                  <th class="p-3.5">Mã Hợp Đồng</th>
                  <th class="p-3.5">Phòng / Cơ Sở</th>
                  <th class="p-3.5">Người Thuê</th>
                  <th class="p-3.5">CCCD / Định danh</th>
                  <th class="p-3.5">Thời Hạn Thuê</th>
                  <th class="p-3.5">Tiền Thuê / Cọc</th>
                  <th class="p-3.5">Trạng Thái</th>
                  <th class="p-3.5 text-right">Chi tiết</th>
                </tr>
              </thead>
              <tbody id="contracts-tbody" class="divide-y divide-slate-100 font-medium">
                <!-- Rendered by JS -->
              </tbody>
            </table>
          </div>
        </div>

      </div>
    </main>
  </div>

  <!-- Modal: Tạo hợp đồng mới -->
  <div id="createContractModal" class="modal-backdrop">
    <div class="modal-content max-w-xl p-6">
      <div class="flex items-center justify-between border-b border-slate-200 pb-3">
        <h3 class="text-lg font-bold text-slate-900">Tạo Hợp Đồng Thuê Mới</h3>
        <button onclick="closeModal('createContractModal')" class="text-slate-400 hover:text-slate-600">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <form onsubmit="handleCreateContract(event)" class="mt-4 space-y-4 text-xs">
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block font-semibold text-slate-700 mb-1">Chọn phòng còn trống <span class="text-red-500">*</span></label>
            <select id="new-ct-room" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 font-bold text-teal-700">
              <option value="P103">Phòng P103 (26 m² • 6.000.000 ₫)</option>
              <option value="P304">Phòng P304 (28 m² • 6.500.000 ₫)</option>
              <option value="P202">Phòng P202 (32 m² • 7.200.000 ₫)</option>
            </select>
          </div>
          <div>
            <label class="block font-semibold text-slate-700 mb-1">Mã hợp đồng</label>
            <input type="text" id="new-ct-code" value="HD-2026-005" readonly class="w-full bg-slate-100 border border-slate-200 rounded-lg p-2.5 font-mono text-slate-500">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block font-semibold text-slate-700 mb-1">Họ tên người thuê đại diện <span class="text-red-500">*</span></label>
            <input type="text" id="new-ct-tenant" placeholder="Nguyễn Văn A" required class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5">
          </div>
          <div>
            <label class="block font-semibold text-slate-700 mb-1">Số điện thoại <span class="text-red-500">*</span></label>
            <input type="text" id="new-ct-phone" placeholder="0912..." required class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5">
          </div>
        </div>

        <div>
          <label class="block font-semibold text-slate-700 mb-1">Số CCCD / Hộ chiếu <span class="text-red-500">*</span></label>
          <input type="text" id="new-ct-cccd" placeholder="00120100xxxx" required class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block font-semibold text-slate-700 mb-1">Ngày bắt đầu</label>
            <input type="date" id="new-ct-start" value="2026-10-01" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5">
          </div>
          <div>
            <label class="block font-semibold text-slate-700 mb-1">Ngày kết thúc (12 tháng)</label>
            <input type="date" id="new-ct-end" value="2027-10-01" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block font-semibold text-slate-700 mb-1">Tiền thuê hàng tháng</label>
            <input type="number" id="new-ct-rent" value="6500000" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 font-bold">
          </div>
          <div>
            <label class="block font-semibold text-slate-700 mb-1">Tiền đặt cọc (1 tháng)</label>
            <input type="number" id="new-ct-deposit" value="6500000" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 font-bold text-teal-700">
          </div>
        </div>

        <div class="mt-6 flex items-center justify-end gap-3 pt-3 border-t border-slate-200">
          <button type="button" onclick="closeModal('createContractModal')" class="px-4 py-2 border border-slate-200 rounded-lg text-slate-600 hover:bg-slate-50 font-medium">Hủy</button>
          <button type="submit" class="px-4 py-2 bg-[#0F766E] text-white rounded-lg font-semibold hover:bg-[#115E59]">Lưu & Ký Hợp Đồng</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    function renderContracts() {
      const search = document.getElementById('contract-search').value.toLowerCase();
      const contracts = DataStore.getContracts();
      const tbody = document.getElementById('contracts-tbody');

      let filtered = contracts.filter(ct => 
        ct.room.toLowerCase().includes(search) || 
        ct.tenant.toLowerCase().includes(search) ||
        ct.code.toLowerCase().includes(search)
      );

      tbody.innerHTML = filtered.map(ct => {
        let badge = '<span class="badge badge-success">Đang hiệu lực</span>';
        if (ct.status === 'EXPIRING_SOON') {
          badge = '<span class="badge badge-warning">Sắp hết hạn</span>';
        }

        return `
          <tr class="hover:bg-slate-50">
            <td class="p-3.5 font-mono font-bold text-slate-900">${ct.code}</td>
            <td class="p-3.5">
              <span class="font-bold text-slate-900">${ct.room}</span>
              <span class="block text-[11px] text-slate-400">${ct.building}</span>
            </td>
            <td class="p-3.5">
              <span class="font-bold text-slate-900">${ct.tenant}</span>
              <span class="block text-[11px] text-slate-400">${ct.phone}</span>
            </td>
            <td class="p-3.5 font-mono text-slate-600">${ct.cccd}</td>
            <td class="p-3.5">${ct.startDate} &rarr; ${ct.endDate}</td>
            <td class="p-3.5">
              <span class="font-bold text-teal-700">${formatVND(ct.rent)}</span>
              <span class="block text-[11px] text-slate-400">Cọc: ${formatVND(ct.deposit)}</span>
            </td>
            <td class="p-3.5">${badge}</td>
            <td class="p-3.5 text-right">
              <button onclick="showToast('Hợp đồng số ${ct.code} đã ký điện tử an toàn');" class="text-teal-700 font-semibold hover:underline">
                Xem &rarr;
              </button>
            </td>
          </tr>
        `;
      }).join('');

      lucide.createIcons();
    }

    function handleCreateContract(e) {
      e.preventDefault();
      const room = document.getElementById('new-ct-room').value;
      const tenant = document.getElementById('new-ct-tenant').value.trim();
      const phone = document.getElementById('new-ct-phone').value.trim();
      const cccd = document.getElementById('new-ct-cccd').value.trim();
      const rent = parseInt(document.getElementById('new-ct-rent').value);
      const deposit = parseInt(document.getElementById('new-ct-deposit').value);

      const contracts = DataStore.getContracts();
      const newContract = {
        id: 'ct-' + Date.now(),
        code: 'HD-2026-' + Math.floor(100 + Math.random() * 900),
        room: room,
        building: 'StayHub Central - Ba Đình',
        tenant: tenant,
        phone: phone,
        cccd: cccd,
        startDate: '2026-10-01',
        endDate: '2027-10-01',
        rent: rent,
        deposit: deposit,
        status: 'ACTIVE'
      };

      contracts.push(newContract);
      DataStore.saveContracts(contracts);

      // Also update room status to OCCUPIED
      const rooms = DataStore.getRooms();
      const targetRoom = rooms.find(r => r.roomNumber === room);
      if (targetRoom) {
        targetRoom.status = 'OCCUPIED';
        targetRoom.tenant = tenant;
        targetRoom.phone = phone;
        DataStore.saveRooms(rooms);
      }

      closeModal('createContractModal');
      showToast(`Hợp đồng ${newContract.code} phòng ${room} đã tạo thành công!`);
      renderContracts();
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderSidebar('contracts.html');
      renderTopbar('Quản lý Hợp đồng Thuê', 'Hợp đồng / Danh sách');
      renderContracts();
    });
  </script>
</body>
</html>
