<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StayHub - Cấu hình Hệ thống</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-50 min-h-screen flex flex-col font-sans">

  <div id="demo-role-bar"></div>

  <div class="flex-1 flex overflow-hidden">
    <aside id="app-sidebar" class="w-64 bg-white border-r border-slate-200 flex flex-col shrink-0 min-h-[calc(100vh-41px)]"></aside>

    <main class="flex-1 flex flex-col min-w-0 overflow-y-auto">
      <header id="app-topbar"></header>

      <div class="p-6 max-w-4xl w-full mx-auto space-y-6">

        <div class="flex items-center justify-between">
          <div>
            <h2 class="text-xl font-bold text-slate-900">Cấu hình Hệ thống & Biểu phí Tiện ích</h2>
            <p class="text-xs text-slate-500 mt-0.5">Thiết lập các thông số vận hành mặc định, định mức giá điện nước và thông tin ngân hàng</p>
          </div>
          <button onclick="showToast('Đã lưu cấu hình hệ thống thành công!')" class="flex items-center gap-2 px-4 py-2 bg-[#0F766E] hover:bg-[#115E59] text-white rounded-lg text-sm font-semibold shadow-sm transition-colors">
            <i data-lucide="save" class="w-4 h-4"></i>
            <span>Lưu Cấu Hình</span>
          </button>
        </div>

        <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm space-y-6 text-xs">
          <!-- Section 1 -->
          <div>
            <h3 class="font-bold text-slate-900 text-sm mb-3 flex items-center gap-2">
              <i data-lucide="zap" class="w-4 h-4 text-amber-500"></i>
              Biểu Phí Điện & Nước Mặc Định
            </h3>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
              <div>
                <label class="block font-semibold text-slate-700 mb-1">Đơn giá Điện (₫ / kWh)</label>
                <input type="number" value="3500" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 font-bold text-slate-900">
              </div>
              <div>
                <label class="block font-semibold text-slate-700 mb-1">Đơn giá Nước (₫ / m³)</label>
                <input type="number" value="25000" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 font-bold text-slate-900">
              </div>
              <div>
                <label class="block font-semibold text-slate-700 mb-1">Phí Dịch vụ Tòa nhà (₫ / phòng)</label>
                <input type="number" value="150000" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 font-bold text-slate-900">
              </div>
            </div>
          </div>

          <hr class="border-slate-200">

          <!-- Section 2 -->
          <div>
            <h3 class="font-bold text-slate-900 text-sm mb-3 flex items-center gap-2">
              <i data-lucide="landmark" class="w-4 h-4 text-teal-600"></i>
              Thông Tin Tài Khoản Nhận Thanh Toán VietQR
            </h3>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
              <div>
                <label class="block font-semibold text-slate-700 mb-1">Ngân hàng</label>
                <input type="text" value="MB Bank (Quân Đội)" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5">
              </div>
              <div>
                <label class="block font-semibold text-slate-700 mb-1">Số tài khoản</label>
                <input type="text" value="0912345678" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 font-mono font-bold">
              </div>
              <div>
                <label class="block font-semibold text-slate-700 mb-1">Tên chủ tài khoản</label>
                <input type="text" value="STAYHUB LIVING CO LTD" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 font-bold">
              </div>
            </div>
          </div>

          <hr class="border-slate-200">

          <!-- Section 3 -->
          <div>
            <h3 class="font-bold text-slate-900 text-sm mb-3 flex items-center gap-2">
              <i data-lucide="message-square" class="w-4 h-4 text-blue-500"></i>
              Cấu Hình Kết Nối Zalo OA (ZNS)
            </h3>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label class="block font-semibold text-slate-700 mb-1">Zalo OA App ID</label>
                <input type="text" value="381920391823901" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 font-mono">
              </div>
              <div>
                <label class="block font-semibold text-slate-700 mb-1">Trạng thái kết nối</label>
                <div class="p-2.5 bg-emerald-50 text-emerald-800 font-semibold rounded-lg border border-emerald-200 flex items-center gap-2">
                  <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
                  Đã xác thực Official Account
                </div>
              </div>
            </div>
          </div>
        </div>

      </div>
    </main>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      renderSidebar('system-settings.html');
      renderTopbar('Cấu hình Hệ thống', 'Hệ thống / Cài đặt');
    });
  </script>
</body>
</html>
